name: Sonar check

# release/26.12 is automatically merged to main. GitHub then loads this workflow
# and its control scripts from main, never from an untrusted PR head.
on:
  pull_request_target:
    branches: [main, release/26.12]
    types: [opened, synchronize, reopened, edited]

permissions: {}
# PR build code must not access the default branch's Actions caches.
cache-mode: none

env:
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

jobs:
  select:
    name: Select Sonar checks
    if: >-
      github.repository == 'NVIDIA/cudf-spark-jni' &&
      (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      checks: write
    concurrency:
      group: sonar-gate-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    outputs:
      gate-id: ${{ steps.gate.outputs.check-id }}
      gate-attempt: ${{ steps.gate.outputs.gate-attempt }}
      sha: ${{ steps.select.outputs.sha }}
      pr-number: ${{ steps.select.outputs.pr-number }}
      branch: ${{ steps.select.outputs.branch }}
      base-ref: ${{ steps.select.outputs.base-ref }}
      run-scan: ${{ steps.select.outputs.run-scan }}
      reason: ${{ steps.select.outputs.reason }}
      trusted-sha: ${{ steps.select.outputs.trusted-sha }}
    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Mark the required Sonar gate in progress
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 0
          script: |
            const gate = require('./trusted/.github/scripts/sonar-check/gate.js');
            await gate({github, context, core, initial: true});
      - name: Select from the complete current PR diff
        if: steps.gate.outputs.active == 'true'
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 0
          script: |
            const select = require('./trusted/.github/scripts/sonar-check/select.js');
            await select({github, context, core, initial: true});
      - name: Mark the selected analysis pending
        if: steps.select.outputs.run-scan == 'true'
        uses: NVIDIA/spark-rapids-common/sonar-check/report@7c549a3539db93ce43fd4c3e44becd119ebb3092
        with:
          phase: pending
          project: ${{ vars.SONAR_PROJECT_KEY }}
          pr-number: ${{ steps.select.outputs.pr-number }}
          sha: ${{ steps.select.outputs.sha }}
          base-ref: ${{ steps.select.outputs.base-ref }}
          sonar-url: ${{ secrets.SONAR_HOST_URL }}

  security:
    name: Script security preflight
    needs: select
    if: needs.select.outputs.run-scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.security.outputs.sha }}
    steps:
      - name: Checkout selected source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.sha }}
          path: source
          # Only source/data checkouts opt in; helper code stays trusted.
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Inspect source with the published scanner image
        id: security
        uses: NVIDIA/spark-rapids-common/sonar-check/scan-scripts@7c549a3539db93ce43fd4c3e44becd119ebb3092
        with:
          source-directory: source
          expected-sha: ${{ needs.select.outputs.sha }}

  compile:
    name: Compile Java for Sonar
    needs: [select, security]
    # Maven plugins can execute PR code. Never run this job on the reusable pool.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout trusted build helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.trusted-sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout selected Java and pinned cuDF sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security.outputs.sha }}
          path: source
          # Only source/data checkouts opt in; helper code stays trusted.
          allow-unsafe-pr-checkout: true
          submodules: true
          persist-credentials: false
      - name: Set up Java for compilation
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ vars.SONAR_BUILD_JAVA_VERSION || '17' }}
          # PR builds must not populate a trusted branch's Maven cache.
          overwrite-settings: false
      - name: Compile without Sonar credentials
        env:
          APPROVED_SHA: ${{ needs.select.outputs.sha }}
        run: bash trusted/.github/scripts/sonar-check/build.sh
      - name: Transfer only this run's Java classes
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-classes-${{ github.run_attempt }}
          path: |
            source/target/classes/**/*.class
            source/target/test-classes/**/*.class
          if-no-files-found: error
          retention-days: 3

  scan:
    name: Internal Sonar analysis
    needs: [select, security, compile]
    runs-on: [self-hosted, Linux, X64, spark-sonar-internal]
    timeout-minutes: 35
    # Hold this lock through server processing and collection. Different PRs may
    # scan concurrently; a new request never aborts an executing analysis.
    concurrency:
      group: sonar-analysis-${{ needs.select.outputs.pr-number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      attempt: ${{ steps.collect.outputs.source-attempt }}
    steps:
      - name: Checkout trusted scan helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.trusted-sha }}
          path: trusted
          persist-credentials: false
      - name: Recheck the selected PR after runner allocation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APPROVED_SHA: ${{ needs.select.outputs.sha }}
          APPROVED_BASE_REF: ${{ needs.select.outputs.base-ref }}
          PR_NUMBER: ${{ needs.select.outputs.pr-number }}
        with:
          retries: 0
          script: |
            const select = require('./trusted/.github/scripts/sonar-check/select.js');
            await select({github, context, core});
      - name: Checkout selected source for analysis only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security.outputs.sha }}
          path: source
          # Only source/data checkouts opt in; helper code stays trusted.
          allow-unsafe-pr-checkout: true
          fetch-depth: 0
          persist-credentials: false
      - name: Download the producing compile artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compile.outputs.artifact-id }}
          path: ${{ runner.temp }}/sonar-classes-${{ github.run_id }}-${{ github.run_attempt }}
          digest-mismatch: error
      - name: Submit the selected analysis
        id: analyze
        continue-on-error: true
        env:
          APPROVED_SHA: ${{ needs.select.outputs.sha }}
          PR_NUMBER: ${{ needs.select.outputs.pr-number }}
          PR_BRANCH: ${{ needs.select.outputs.branch }}
          CLASSES_DIRECTORY: ${{ runner.temp }}/sonar-classes-${{ github.run_id }}-${{ github.run_attempt }}
          PR_BASE_REF: ${{ needs.select.outputs.base-ref }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 -I trusted/.github/scripts/sonar-check/scan.py
      - name: Collect the exact analysis and quality gate
        id: collect
        if: always() && steps.analyze.outputs.task-file != ''
        continue-on-error: true
        timeout-minutes: 12
        uses: NVIDIA/spark-rapids-common/sonar-check/collect@7c549a3539db93ce43fd4c3e44becd119ebb3092
        with:
          task-file: ${{ steps.analyze.outputs.task-file }}
          result-path: ${{ steps.analyze.outputs.result-path }}
          project: ${{ vars.SONAR_PROJECT_KEY }}
          pr-number: ${{ needs.select.outputs.pr-number }}
          sha: ${{ needs.select.outputs.sha }}
          base-ref: ${{ needs.select.outputs.base-ref }}
          scanner-outcome: ${{ steps.analyze.outcome }}
          sonar-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
      - name: Transfer the analysis result, including a failed gate
        id: upload
        if: always() && steps.collect.outputs.result-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-result-${{ github.run_attempt }}
          path: ${{ steps.collect.outputs.result-path }}
          if-no-files-found: error
          retention-days: 3

      - name: Remove this scan's temporary files
        if: always()
        env:
          SONAR_WORK_DIRECTORY: ${{ steps.analyze.outputs.work-directory }}
          CLASSES_DIRECTORY: ${{ runner.temp }}/sonar-classes-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -I trusted/.github/scripts/sonar-check/scan.py --cleanup

  report:
    name: Report Sonar findings
    needs: [select, security, compile, scan]
    if: >-
      always() && needs.select.outputs.sha != '' &&
      needs.select.outputs.run-scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout trusted diagnostics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.trusted-sha }}
          path: trusted
          persist-credentials: false
      - name: Identify failed prerequisites
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const diagnose = require('./trusted/.github/scripts/sonar-check/diagnostics.js');
            await diagnose({github, context, core});
      - name: Download the exact scan result
        id: download
        if: always() && needs.scan.outputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/sonar-report
          digest-mismatch: error
      - name: Publish findings and the scoped Sonar status
        if: always()
        uses: NVIDIA/spark-rapids-common/sonar-check/report@7c549a3539db93ce43fd4c3e44becd119ebb3092
        with:
          # Never consume a partial download after a digest/transfer failure.
          result-path: ${{ runner.temp }}/${{ steps.download.outcome == 'success' && 'sonar-report/result.json' || 'sonar-report-unavailable.json' }}
          project: ${{ vars.SONAR_PROJECT_KEY }}
          pr-number: ${{ needs.select.outputs.pr-number }}
          sha: ${{ needs.select.outputs.sha }}
          base-ref: ${{ needs.select.outputs.base-ref }}
          source-attempt: ${{ needs.scan.outputs.attempt || github.run_attempt }}
          scan-result: ${{ steps.download.outcome == 'failure' && 'failure' || needs.scan.result }}
          sonar-url: ${{ secrets.SONAR_HOST_URL }}

  gate:
    name: Finalize Sonar check gate
    if: >-
      always() && github.repository == 'NVIDIA/cudf-spark-jni' &&
      (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base)
    needs: [select, security, compile, scan, report]
    # Serialize only gate mutations, not scans, including same-SHA title edits.
    concurrency:
      group: sonar-gate-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Checkout trusted gate helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.trusted-sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Complete the check on the exact PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          retries: 0
          script: |
            const gate = require('./trusted/.github/scripts/sonar-check/gate.js');
            await gate({github, context, core});
