name: Sonar preparation

# PR code runs only on disposable hosted runners. The trusted Sonar consumer
# independently verifies this run and performs preflight before internal scanning.
on:
  pull_request:
    branches: [main, release/26.12]
    # Match CPU CI: title/body edits do not restart preparation.
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
# PR build code must not access the default branch's Actions caches.
cache-mode: none

jobs:
  select:
    name: Select Sonar checks
    if: github.repository == 'NVIDIA/cudf-spark-jni'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      pr-number: ${{ steps.select.outputs.pr-number }}
      branch: ${{ steps.select.outputs.branch }}
      base-ref: ${{ steps.select.outputs.base-ref }}
      run-scan: ${{ steps.select.outputs.run-scan }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout workflow helpers from the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: workflow
          sparse-checkout: .github
          persist-credentials: false
      - name: Select from the complete current PR diff
        id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 0
          script: |
            const select = require('./workflow/.github/scripts/sonar-check/select.js');
            await select({github, context, core, initial: true});

  compile:
    name: Compile Java for Sonar
    needs: select
    if: needs.select.outputs.run-scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout workflow helpers from the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: workflow
          sparse-checkout: .github
          persist-credentials: false
      - name: Checkout selected Java and pinned cuDF sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.sha }}
          path: source
          submodules: true
          persist-credentials: false
      - name: Set up Java for compilation
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ vars.SONAR_BUILD_JAVA_VERSION || '17' }}
          overwrite-settings: false
      - name: Compile without Sonar credentials
        env:
          APPROVED_SHA: ${{ needs.select.outputs.sha }}
        run: bash workflow/.github/scripts/sonar-check/build.sh
      - name: Transfer only this run's Java classes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-classes-${{ github.run_attempt }}
          path: |
            source/target/classes/**/*.class
            source/target/test-classes/**/*.class
          if-no-files-found: error
          retention-days: 3
