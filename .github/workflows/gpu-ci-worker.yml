name: JNI CI worker
run-name: ${{ inputs.request-id }}

# Dispatch only. No pull_request registration trigger that leaves skipped checks.
on:
  workflow_dispatch:
    inputs:
      request-id:
        required: true
        type: string
      parent-run-id:
        required: true
        type: string
      parent-run-attempt:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      source-sha:
        required: true
        type: string
      runner:
        required: true
        type: string
      workload:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  worker:
    name: worker
    if: github.repository == 'NVIDIA/cudf-spark-jni'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 240
    env:
      TZ: UTC
      CI_IMAGE_METADATA_HELPER: ${{ github.workspace }}/.ci-common/container-image/metadata.py
      CLASSIFIER: ${{ fromJSON(inputs.workload).classifier }}
      BASE_BRANCH: ${{ fromJSON(inputs.workload).base-branch }}
      JNI_MODE: ${{ fromJSON(inputs.workload).mode || 'test' }}
      JNI_ARCH: ${{ fromJSON(inputs.workload).architecture || 'amd64' }}
    steps:
      - name: Check coordinator and approved source
        uses: NVIDIA/spark-rapids-common/runner-queue-fallback/guard@main
        with:
          request-id: ${{ inputs.request-id }}
          parent-run-id: ${{ inputs.parent-run-id }}
          parent-run-attempt: ${{ inputs.parent-run-attempt }}
          source-ref: ${{ inputs.source-ref }}
          source-sha: ${{ inputs.source-sha }}
      - name: Check approved worker definition
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          WORKLOAD_MINUTES: '210'
        run: |
          set -euo pipefail
          # Include setup time in the workload budget; leave 30 minutes for evidence/caches.
          echo "JNI_WORKLOAD_DEADLINE=$(( $(date +%s) + WORKLOAD_MINUTES * 60 ))" >> "$GITHUB_ENV"
          case "$JNI_ARCH:$RUNNER_ARCH" in
            amd64:X64|arm64:ARM64) ;;
            *)
              echo "::error::Requested $JNI_ARCH but allocated $RUNNER_ARCH"
              exit 1
              ;;
          esac
          if [[ "$JNI_MODE" == cache ]]; then
            # Trusted post-merge sources warm main's cache scope. PR code must
            # never reach this path; the parent workflow is verified below.
            [[ "$GITHUB_REF" == refs/heads/main ]]
            [[ "$SOURCE_REF" == "refs/heads/$BASE_BRANCH" ]]
          else
            [[ "$JNI_MODE" == test ]]
            [[ "$JNI_ARCH" == amd64 ]]
            [[ "$SOURCE_REF" =~ ^refs/heads/pull-request/[0-9]+$ ]]
            [[ "$GITHUB_REF" == "$SOURCE_REF" && "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          fi
          [[ "$CLASSIFIER" == cuda12 || "$CLASSIFIER" == cuda13 ]]
      # A PR can be retargeted while its worker is queued. Never let that silently
      # change release pinning or reuse a main-policy result for a release PR.
      - name: Verify workload source and target
        uses: actions/github-script@v9
        env:
          PARENT_RUN_ID: ${{ inputs.parent-run-id }}
        with:
          script: |
            const base = process.env.BASE_BRANCH;
            if (base !== 'main' && !/^release\/[0-9]{2}\.[0-9]{2}$/.test(base)) {
              throw new Error('Unsupported JNI target branch');
            }
            if (process.env.JNI_MODE === 'cache') {
              const {data: parent} = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: Number(process.env.PARENT_RUN_ID),
              });
              if (context.ref !== 'refs/heads/main' || parent.head_branch !== 'main' ||
                  parent.path !== '.github/workflows/gpu-cache.yml' ||
                  !['push', 'workflow_dispatch'].includes(parent.event)) {
                throw new Error('Only the main post-merge cache workflow may prepare shared caches');
              }
              // Pending warmers select the latest source when admitted, while their
              // workflow event can refer to an older, still-trusted main revision.
              if (parent.head_sha !== context.sha) {
                const {data: lineage} = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo, basehead: `${parent.head_sha}...${context.sha}`, per_page: 1,
                });
                if (lineage.status !== 'ahead' || lineage.merge_base_commit?.sha !== parent.head_sha) {
                  throw new Error('Cache parent must be an ancestor of the trusted main worker');
                }
              }
            } else {
              const number = Number(context.ref.split('/').at(-1));
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
              if (pr.state !== 'open' || pr.head.sha !== context.sha || pr.base.ref !== base) {
                throw new Error('PR head or target changed while queued; approve and rerun the current PR');
              }
            }
      - name: Checkout approved source
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Checkout shared image metadata helper
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          repository: NVIDIA/spark-rapids-common
          ref: main
          path: .ci-common
          persist-credentials: false
      # Resolve on the host, before creating the workload container. Missing or
      # recipe-incompatible images build locally; auth/network errors fail closed.
      - name: Select compatible public toolchain
        id: image
        timeout-minutes: 5
        run: python3 ci/gha-image.py "$CLASSIFIER" "$BASE_BRANCH" "$JNI_ARCH"
      - name: Set up Docker Buildx
        if: steps.image.outputs.reference == ''
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build and smoke-test unpublished PR toolchain
        if: steps.image.outputs.reference == ''
        timeout-minutes: 180
        uses: NVIDIA/spark-rapids-common/container-image@main
        with:
          config: ${{ steps.image.outputs.config }}
      - name: Pin workload image
        id: toolchain
        timeout-minutes: 15
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
          CONFIG: ${{ steps.image.outputs.config }}
        run: |
          set -euo pipefail
          if [[ -n "$REFERENCE" ]]; then
            docker pull "$REFERENCE"
          else
            REFERENCE="image-validation:$(jq -er '.tag' <<< "$CONFIG")"
          fi
          image_id=$(docker image inspect --format '{{.Id}}' "$REFERENCE")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
      - name: Restore Maven dependencies
        id: maven-cache
        uses: actions/cache/restore@v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: ${{ runner.temp }}/jni-home/.m2/repository
          # Save a fresh snapshot even on reruns; a partial cache is immutable.
          # Prefer this branch's latest dependencies, then the trusted main baseline.
          key: jni-maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pom.xml') }}-${{ inputs.source-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jni-maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pom.xml') }}-
            jni-maven-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore native compilation and dependency sources
        id: native-cache
        uses: actions/cache/restore@v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          path: |
            ${{ runner.temp }}/jni-home/.ccache
            ${{ runner.temp }}/jni-home/.cache/cpm
          # Main owns the trusted baseline; PRs only save their branch's caches.
          # Main/release checkouts sharing a release line and recipe share this
          # RAPIDS-target baseline. Ccache also checks source/compiler/flags.
          key: jni-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.release-line }}-${{ env.CLASSIFIER }}-${{ steps.image.outputs.recipe }}-${{ inputs.source-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jni-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.release-line }}-${{ env.CLASSIFIER }}-${{ steps.image.outputs.recipe }}-
      - name: Run JNI workload
        id: tests
        env:
          JNI_IMAGE: ${{ steps.toolchain.outputs.image }}
          # Read-only job token, scoped to this guarded worker step, never a PAT.
          GITHUB_DOWNLOAD_TOKEN: ${{ github.token }}
        run: bash ci/gha-premerge.sh
      # Collect evidence before optional cache uploads. Diagnostics must never
      # replace the workload result; cancellation/runner loss may prevent collection.
      - name: Upload JNI test evidence
        id: evidence
        if: ${{ !cancelled() && steps.tests.outputs.publish-safe == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jni-${{ env.CLASSIFIER }}-${{ github.run_id }}
          path: target/gha-evidence/
          if-no-files-found: warn
          retention-days: 2
      - name: JNI result and diagnostics
        if: ${{ !cancelled() && steps.tests.outputs.publish-safe == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          IMAGE_ID: ${{ steps.toolchain.outputs.image }}
          IMAGE_RECIPE: ${{ steps.image.outputs.recipe }}
          MAVEN_CACHE_KEY: ${{ steps.maven-cache.outputs.cache-matched-key }}
          NATIVE_CACHE_KEY: ${{ steps.native-cache.outputs.cache-matched-key }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        working-directory: target/gha-evidence
        run: python3 "$GITHUB_WORKSPACE/ci/gha-report.py"
      # A failed test does not invalidate compiler/dependency caches. Save partial
      # useful work on this branch too, without masking failures or cancellation.
      - name: Save Maven dependencies
        if: >-
          !cancelled() && steps.tests.outputs.publish-safe == 'true' &&
          steps.maven-cache.outputs.cache-primary-key != '' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/jni-home/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}
      - name: Save native compilation and dependency sources
        if: >-
          !cancelled() && steps.tests.outputs.publish-safe == 'true' &&
          steps.native-cache.outputs.cache-primary-key != '' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            ${{ runner.temp }}/jni-home/.ccache
            ${{ runner.temp }}/jni-home/.cache/cpm
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
