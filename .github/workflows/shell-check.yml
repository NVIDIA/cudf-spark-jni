# A workflow to check shell script syntax
name: shell check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  shell-check:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[bot]')"
    steps:
      - name: Checkout code
        uses: NVIDIA/spark-rapids-common/checkout@main

      - name: Run ShellCheck
        uses: NVIDIA/spark-rapids-common/shell-check@main
        with:
          excluded_codes:
            SC3010,
            SC2054,
            SC2124
          # code explanation:
          # SC3010: In POSIX sh, [[ ]] is undefined.
          # SC2054: Use spaces, not commas, to separate array elements.
          # SC2124: Assigning an array to a string! Assign as array, or use * instead of @ to concatenate.

      - name: Test submodule-sync credential redaction
        shell: bash
        run: |
          set -euo pipefail
          source <(sed -n '/^redact_credentials() {/,/^}/p' ci/submodule-sync.sh)

          expect_redaction() {
            local username=$1 password=$2 input=$3 expected=$4 actual
            ART_CREDS_USR=$username ART_CREDS_PSW=$password
            actual=$(printf '%s\n' "$input" | redact_credentials)
            if [[ "$actual" != "$expected" ]]; then
              printf 'Expected %q, got %q\n' "$expected" "$actual" >&2
              return 1
            fi
          }

          expect_redaction abc abc123 'username=abc password=abc123' 'username=**** password=****'
          expect_redaction abc123 abc 'username=abc123 password=abc' 'username=**** password=****'
          expect_redaction 'a[b]' 'a[b]c#d' 'username=a[b] password=a[b]c#d' 'username=**** password=****'
          encoded=$(printf '%s:%s' abc YWJj | base64 -w 0)
          expect_redaction abc YWJj "Authorization: Basic $encoded" 'Authorization: Basic ****'

          # Exercise the GHA filter with synthetic credentials only. Full reports
          # and summaries must consume the same sanitized evidence as the console.
          python3 - <<'PY'
          import base64
          import importlib.util
          import io
          from pathlib import Path
          import subprocess
          import tempfile
          import xml.etree.ElementTree as ET

          helper = Path(".github/scripts/gpu-ci/download-auth.py").resolve()
          spec = importlib.util.spec_from_file_location("download_auth", helper)
          auth = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(auth)
          token = "synthetic[a]#token"
          encoded = base64.b64encode(f"x-access-token:{token}".encode())
          sample = (f"password={token}\n".encode() + b"encoded=" + encoded +
                    b"\nAuthorization: Basic " + encoded +
                    b"\nauthorization: Basic\n  " + encoded + b"\nuseful error\n")
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              netrc = root / "netrc"
              netrc.write_text(f'machine github.com login x-access-token password {token}\n')
              netrc.chmod(0o600)
              secrets = auth.credentials(netrc)
              result = subprocess.run(["python3", str(helper), str(netrc)],
                                      input=sample, capture_output=True, check=True)
              assert token.encode() not in result.stdout and encoded not in result.stdout
              assert b"useful error" in result.stdout
              # Encoded values are replaced first, even when they contain the raw token.
              output = io.BytesIO()
              auth.redact(io.BytesIO(b"YWJj:YWJjYWJj\n"), output, (b"YWJjYWJj", b"YWJj"))
              assert output.getvalue() == b"****:****\n"
              workspace = root / "workspace"
              report = workspace / "target/surefire-reports/TEST-example.xml"
              report.parent.mkdir(parents=True)
              xml = (b'<testsuite><testcase name="download"><failure message="Authorization: Basic ' +
                     encoded + b'">' + token.encode() + b'</failure></testcase></testsuite>')
              report.write_bytes(xml)
              evidence = root / "evidence"
              auth.stage(workspace, evidence, secrets)
              filtered = (evidence / report.relative_to(workspace)).read_bytes()
              assert token.encode() not in filtered and encoded not in filtered
              case = ET.fromstring(filtered).find("testcase")
              assert case.get("name") == "download" and case.find("failure").text == "****"
              # Raw files are left intact; only staged, filtered copies are uploaded.
              assert report.read_bytes() == xml
              report.unlink()
              report.symlink_to(netrc)
              try:
                  auth.stage(workspace, root / "unsafe", secrets)
              except ValueError:
                  assert not (root / "unsafe").exists()
              else:
                  raise AssertionError("Symlink diagnostic was accepted")
              # Malformed credentials must suppress output, not echo parser details.
              netrc.write_text(f"unexpected-{token}")
              result = subprocess.run(["python3", str(helper), str(netrc)],
                                      input=sample, capture_output=True)
              assert result.returncode != 0 and not result.stdout
              assert token.encode() not in result.stderr
              netrc.write_text("")
              result = subprocess.run(["python3", str(helper), str(netrc)],
                                      input=b"anonymous build\n", capture_output=True, check=True)
              assert result.stdout == b"anonymous build\n"
          print("GHA credential stream and evidence checks passed")
          PY

      - name: Run Git network retry regression tests
        run: ci/test-retry-git-network.sh
