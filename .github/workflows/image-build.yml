name: Daily image build

on:
  # Main also aliases YY.MM-* until release/YY.MM exists. See ci/README.md.
  # The daily schedule runs only on main. Release publication is push/manual only.
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    paths:
      - 'pom.xml'
      - 'ci/Dockerfile'
      - 'ci/image-config.sh'
      - 'ci/image-config.py'
      - 'ci/image-smoke.sh'
      - 'ci/toolchains.json'
      - '.github/image-builds.json'
      - '.github/workflows/image-build.yml'

permissions:
  contents: read

concurrency:
  # All branches share the package with image-cleanup.yml; retain queued publishes.
  group: jni-image-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  configure:
    if: >-
      github.repository == 'NVIDIA/cudf-spark-jni' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_IMAGE_METADATA_HELPER: ${{ github.workspace }}/.ci-common/container-image/metadata.py
    outputs:
      images: ${{ steps.catalog.outputs.images }}
      manifests: ${{ steps.catalog.outputs.manifests }}
      release-line: ${{ fromJSON(steps.version.outputs.metadata || '{}').release-line }}
    steps:
      - name: Checkout image catalog
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read project version and tag owner
        id: version
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          metadata=$(bash ci/image-config.sh version --branch "$SOURCE_BRANCH")
          printf 'metadata=%s\n' "$metadata" >> "$GITHUB_OUTPUT"
      - name: Resolve project toolchains
        id: toolchains
        uses: NVIDIA/spark-rapids-common/resolve-toolchain-config@main
        with:
          config: ci/toolchains.json
          version-key: ${{ fromJSON(steps.version.outputs.metadata).toolchain-key }}
      - name: Checkout shared image metadata helper
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          repository: NVIDIA/spark-rapids-common
          ref: main
          path: .ci-common
          persist-credentials: false
      - name: Resolve image configurations
        id: catalog
        shell: bash
        env:
          CI_TOOLCHAINS: ${{ steps.toolchains.outputs.toolchains }}
          # Preserve the original setup error if version metadata was not produced.
          IMAGE_TAG_PREFIX: ${{ fromJSON(steps.version.outputs.metadata || '{}').tag-prefix }}
        run: |
          set -euo pipefail
          : "${IMAGE_TAG_PREFIX:?Missing image tag prefix from version metadata}"
          images=$(bash ci/image-config.sh matrix)
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"
          manifests=$(jq -c '[.[] | {tag: ."manifest-tag", toolchain}] | unique' <<< "$images")
          printf 'manifests=%s\n' "$manifests" >> "$GITHUB_OUTPUT"

  jni-images:
    name: Build JNI image ${{ matrix.image.tag }}
    needs: configure
    # Main and the matching release publisher must not race the ownership transfer.
    concurrency:
      group: image-publish-${{ needs.configure.outputs.release-line }}-${{ matrix.image.toolchain }}-${{ matrix.image.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: ${{ fromJSON(needs.configure.outputs.images) }}
    # Build natively; GitHub has no ubuntu-latest-arm label.
    runs-on: ${{ matrix.image.platform == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    # Fresh builds also need time for cache export, registry transfers and smoke checks.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted image source
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare image configuration
        id: image
        shell: bash
        env:
          IMAGE_CONFIG: ${{ toJSON(matrix.image) }}
        run: |
          set -euo pipefail
          # Publish freshly built layers; only export a baseline for later PR builds.
          # Use the actual build worker's CPU count, not the configuration job's.
          parallel=$(getconf _NPROCESSORS_ONLN)
          config=$(jq -c --arg parallel "$parallel" \
            'del(."cache-from") | ."build-args".PARALLEL_LEVEL = $parallel' <<< "$IMAGE_CONFIG")
          printf 'Native image build: %s, %s parallel compile jobs\n' \
            "$(jq -r '.platform' <<< "$config")" "$parallel"
          printf 'config=%s\n' "$config" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build, verify, and publish
        id: publish
        # The first GHCR package may need a one-time public visibility setting.
        # Common promotes the toolchain tag only after anonymous pull and smoke pass.
        uses: NVIDIA/spark-rapids-common/container-image@main
        with:
          config: ${{ steps.image.outputs.config }}
          publish: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check version alias ownership after publication
        if: github.ref == 'refs/heads/main'
        id: alias
        uses: actions/github-script@v9
        env:
          RELEASE_LINE: ${{ needs.configure.outputs.release-line }}
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image }}
          VERIFIED_REFERENCE: ${{ steps.publish.outputs.reference }}
        with:
          retries: 3
          script: |
            const {RELEASE_LINE, PUBLISHED_IMAGE, VERIFIED_REFERENCE} = process.env;
            const expected = `ghcr.io/${context.repo.owner}/${context.repo.repo}/jni-build`.toLowerCase();
            if (!/^\d{2}\.\d{2}$/.test(RELEASE_LINE) || PUBLISHED_IMAGE !== expected ||
                !VERIFIED_REFERENCE?.startsWith(`${expected}@sha256:`) ||
                !/^sha256:[0-9a-f]{64}$/.test(VERIFIED_REFERENCE.slice(expected.length + 1))) {
              throw new Error('Missing or invalid verified publication outputs; version alias was not updated.');
            }
            const branch = `release/${RELEASE_LINE}`;
            const result = await github.graphql(`query($owner: String!, $repo: String!, $ref: String!) {
              repository(owner: $owner, name: $repo) { ref(qualifiedName: $ref) { name } }
            }`, {...context.repo, ref: `refs/heads/${branch}`, request: {timeout: 30000}});
            if (!result.repository || !Object.hasOwn(result.repository, 'ref') ||
                (result.repository.ref !== null && result.repository.ref.name !== branch)) {
              throw new Error('Cannot confirm release branch ownership; version alias was not updated.');
            }
            const allowed = result.repository.ref === null;
            core.setOutput('allowed', allowed);
            core.info(allowed ? `No ${branch}; alias the verified main image without rebuilding.` :
              `${branch} exists; leave its version tags unchanged.`);
      - name: Authenticate for version alias promotion
        if: steps.alias.outputs.allowed == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Alias the verified main digest to the project version
        if: steps.alias.outputs.allowed == 'true'
        shell: bash
        env:
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image }}
          VERIFIED_REFERENCE: ${{ steps.publish.outputs.reference }}
          RELEASE_LINE: ${{ needs.configure.outputs.release-line }}
          MAIN_TAG: ${{ matrix.image.tag }}
        run: |
          set -euo pipefail
          [[ "$MAIN_TAG" == main-* ]]
          alias="$PUBLISHED_IMAGE:$RELEASE_LINE-${MAIN_TAG#main-}"
          docker buildx imagetools create --prefer-index=false --tag "$alias" "$VERIFIED_REFERENCE"
          printf 'Version alias: %s\nSame verified digest: %s\nNo additional image build.\n' \
            "$alias" "$VERIFIED_REFERENCE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record verified native image
        shell: bash
        env:
          IMAGE_CONFIG: ${{ toJSON(matrix.image) }}
          VERIFIED_REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          set -euo pipefail
          mkdir -p image-records
          tag=$(jq -r '.tag' <<< "$IMAGE_CONFIG")
          jq --arg reference "$VERIFIED_REFERENCE" --arg sha "$GITHUB_SHA" \
            '{tag, platform, version, reference: $reference, "source-sha": $sha}' \
            <<< "$IMAGE_CONFIG" > "image-records/$tag.json"
      - name: Share verified native image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jni-image-${{ matrix.image.tag }}
          path: image-records/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  manifests:
    name: Publish multi-platform tag ${{ matrix.manifest.tag }}
    needs: [configure, jni-images]
    # A different CUDA family may fail. This family still requires both verified records.
    if: ${{ !cancelled() && needs.configure.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.configure.outputs.manifests) }}
    concurrency:
      group: image-publish-${{ needs.configure.outputs.release-line }}-${{ matrix.manifest.toolchain }}-manifest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout trusted image metadata
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download this CUDA family's verified image records
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: jni-image-${{ matrix.manifest.tag }}-*
          path: image-records
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Authenticate for manifest publication
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified platform pair
        id: publish
        shell: bash
        env:
          CI_IMAGE_CONFIGS: ${{ needs.configure.outputs.images }}
          MANIFEST_TAG: ${{ matrix.manifest.tag }}
        run: |
          set -euo pipefail
          config=$(python3 ci/image-config.py manifest "$MANIFEST_TAG" \
            --records-dir image-records --source-sha "$GITHUB_SHA")
          image=$(jq -r '.image' <<< "$config")
          mapfile -t sources < <(jq -r '.sources[]' <<< "$config")

          # Merge immutable, smoke-tested digests, never the independently moving tags.
          # Buildx flattens input indexes and keeps their attestation descriptors.
          docker buildx imagetools create --dry-run "${sources[@]}" > manifest.json
          jq -e '[.manifests[] | select(.platform.os != "unknown") |
            (.platform.os + "/" + .platform.architecture)] | sort ==
            ["linux/amd64", "linux/arm64"]' manifest.json
          # Keep a disposable tag after moving aliases advance so cleanup can retire this index.
          candidate="$image:build-${MANIFEST_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$candidate" \
            --metadata-file manifest-metadata.json "${sources[@]}"
          digest=$(jq -er '."containerimage.descriptor".digest |
            select(test("^sha256:[0-9a-f]{64}$"))' manifest-metadata.json)
          docker buildx imagetools create --prefer-index=false \
            --tag "$image:$MANIFEST_TAG" "$image@$digest"
          printf 'image=%s\nreference=%s@%s\n' "$image" "$image" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published %s:%s\nDigest: %s\nPlatforms: linux/amd64, linux/arm64\n' \
            "$image" "$MANIFEST_TAG" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check version alias ownership
        if: github.ref == 'refs/heads/main'
        id: alias
        uses: actions/github-script@v9
        env:
          RELEASE_LINE: ${{ needs.configure.outputs.release-line }}
        with:
          retries: 3
          script: |
            const branch = `release/${process.env.RELEASE_LINE}`;
            const result = await github.graphql(`query($owner: String!, $repo: String!, $ref: String!) {
              repository(owner: $owner, name: $repo) { ref(qualifiedName: $ref) { name } }
            }`, {...context.repo, ref: `refs/heads/${branch}`, request: {timeout: 30000}});
            if (!result.repository || !Object.hasOwn(result.repository, 'ref') ||
                (result.repository.ref !== null && result.repository.ref.name !== branch)) {
              throw new Error('Cannot confirm release branch ownership; version alias was not updated.');
            }
            core.setOutput('allowed', result.repository.ref === null);
            core.info(result.repository.ref === null ? `No ${branch}; publish the version alias.` :
              `${branch} owns its version tags; leave them unchanged.`);
      - name: Alias the multi-platform digest to the project version
        if: steps.alias.outputs.allowed == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          VERIFIED_REFERENCE: ${{ steps.publish.outputs.reference }}
          RELEASE_LINE: ${{ needs.configure.outputs.release-line }}
          MAIN_TAG: ${{ matrix.manifest.tag }}
        run: |
          set -euo pipefail
          [[ "$MAIN_TAG" == main-* ]]
          alias="$IMAGE:$RELEASE_LINE-${MAIN_TAG#main-}"
          docker buildx imagetools create --tag "$alias" "$VERIFIED_REFERENCE"
          printf 'Version alias: %s\nSame multi-platform digest: %s\n' \
            "$alias" "$VERIFIED_REFERENCE" | tee -a "$GITHUB_STEP_SUMMARY"
