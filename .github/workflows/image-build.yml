name: Daily image build

on:
  # Main alone owns the shared tags, including toolchains pinned by release lines.
  # Release PRs validate in cpu-ci.yml but never publish. See ci/README.md.
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'ci/Dockerfile'
      - 'ci/image-config.sh'
      - 'ci/image-smoke.sh'
      - 'ci/toolchains.json'
      - '.github/image-builds.json'
      - '.github/workflows/image-build.yml'

permissions:
  contents: read

concurrency:
  # Non-main dispatches are skipped below and cannot replace a pending main run.
  group: image-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.repository == 'NVIDIA/cudf-spark-jni' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.catalog.outputs.images }}
    steps:
      - name: Checkout image catalog
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve all supported toolchain images
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          images=$(bash ci/image-config.sh matrix all)
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

  images:
    name: Build ${{ matrix.image.tag }}
    needs: configure
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJSON(needs.configure.outputs.images) }}
    runs-on: ubuntu-latest
    # Fresh builds also need time for cache export, registry transfers and smoke checks.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      # These toolchain builds need no GPU or dedicated CPU runner pool.
      - name: Checkout trusted image source
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare image configuration
        id: image
        shell: bash
        env:
          IMAGE_CONFIG: ${{ toJSON(matrix.image) }}
        run: |
          # Publish freshly built layers; only export a baseline for later PR builds.
          config=$(jq -c 'del(."cache-from")' <<< "$IMAGE_CONFIG")
          printf 'config=%s\n' "$config" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build, verify, and publish
        # The first GHCR package may need a one-time public visibility setting.
        # Common promotes the toolchain tag only after anonymous pull and smoke pass.
        uses: NVIDIA/spark-rapids-common/container-image@main
        with:
          config: ${{ steps.image.outputs.config }}
          publish: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
