name: Daily image build

on:
  # Daily builds are main-only. Image-input pushes and manual dispatches also
  # publish release images; PR validation is separate in cpu-ci.yml.
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    paths:
      - 'pom.xml'
      - 'ci/Dockerfile'
      - 'ci/image-config.sh'
      - 'ci/image-smoke.sh'
      - 'ci/toolchains.json'
      - '.github/image-builds.json'
      - '.github/workflows/image-build.yml'

permissions:
  contents: read

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.repository == 'NVIDIA/cudf-spark-jni' &&
      (github.event_name != 'schedule' || github.ref == 'refs/heads/main') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.catalog.outputs.images }}
      toolchains: ${{ steps.toolchains.outputs.toolchains }}
      tags: ${{ steps.catalog.outputs.tags }}
    steps:
      - name: Checkout image catalog
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(bash ci/image-config.sh version)
          line=$(jq -r '."release-line"' <<< "$metadata")
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == "refs/heads/release/$line" ]]
          printf 'metadata=%s\n' "$metadata" >> "$GITHUB_OUTPUT"
      - name: Resolve project toolchains
        id: toolchains
        uses: NVIDIA/spark-rapids-common/resolve-toolchain-config@main
        with:
          config: ci/toolchains.json
          version-key: ${{ fromJSON(steps.version.outputs.metadata).release-line }}
          allow-default: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate configured images and toolchain tags
        id: catalog
        shell: bash
        env:
          CI_TOOLCHAINS: ${{ steps.toolchains.outputs.toolchains }}
        run: |
          set -euo pipefail
          # Main may use default for a new YY.MM. Pin that line before release branch-out.
          images=$(bash ci/image-config.sh list)
          tags='{}'
          while IFS= read -r image; do
            config=$(bash ci/image-config.sh describe "$image")
            tags=$(jq -c --arg name "$image" --argjson config "$config" \
              '. + {($name): ($config.image + ":" + $config.tag)}' <<< "$tags")
          done < <(jq -r '.[]' <<< "$images")
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

  images:
    name: Build ${{ matrix.image }}
    needs: configure
    # Every branch publishing the same toolchain tag shares one promotion lock.
    concurrency:
      group: image-publish-${{ fromJSON(needs.configure.outputs.tags)[matrix.image] }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: ${{ fromJSON(needs.configure.outputs.images) }}
    runs-on: ubuntu-latest
    # Fresh builds also need time for cache export, registry transfers and smoke checks.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      # These toolchain builds need no GPU or dedicated CPU runner pool.
      - name: Checkout trusted image source
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare image configuration
        id: image
        shell: bash
        env:
          CI_TOOLCHAINS: ${{ needs.configure.outputs.toolchains }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          # Publish freshly built layers; only export a baseline for later PR builds.
          config=$(bash ci/image-config.sh describe "$IMAGE_NAME" | jq -c 'del(."cache-from")')
          printf 'config=%s\n' "$config" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build, verify, and publish
        # The first GHCR package may need a one-time public visibility setting.
        # Common promotes the toolchain tag only after anonymous pull and smoke pass.
        uses: NVIDIA/spark-rapids-common/container-image@main
        with:
          config: ${{ steps.image.outputs.config }}
          publish: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
