name: GPU cache preparation

# Build-only warming is independent of the required PR GPU gate. Release sources
# run in main's cache scope so copied PR branches can restore their baseline.
on:
  push:
    branches: [main, 'release/[0-9][0-9].[0-9][0-9]']
  workflow_dispatch:
    inputs:
      source-branch:
        description: 'Source branch: main or release/YY.MM. Run this workflow on main.'
        default: main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Forwarders and main-context builds must not cancel each other.
  # One active run and one replaceable pending run per source branch; no fixed delay.
  group: gpu-cache-${{ github.ref }}-${{ inputs.source-branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  forward:
    name: Forward release source to main
    if: >-
      github.repository == 'NVIDIA/cudf-spark-jni' &&
      github.event_name == 'push' && github.ref != 'refs/heads/main' &&
      !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const match = /^refs\/heads\/(release\/[0-9]{2}\.[0-9]{2})$/.exec(context.ref);
            if (!match) throw new Error('Expected a release/YY.MM push');
            // Dispatch once. A timeout may mean the request was accepted.
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'gpu-cache.yml', ref: 'main',
              inputs: {'source-branch': match[1]},
            });

  select:
    name: Select trusted cache source
    if: >-
      github.repository == 'NVIDIA/cudf-spark-jni' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.ref == 'refs/heads/main' && !github.event.deleted))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source-ref: ${{ steps.source.outputs.source-ref }}
      source-sha: ${{ steps.source.outputs.source-sha }}
      source-branch: ${{ steps.source.outputs.source-branch }}
      suites: ${{ steps.suites.outputs.suites || '[]' }}
      prepared: ${{ steps.suites.outputs.prepared || '[]' }}
    steps:
      - name: Resolve current trusted branch source
        id: source
        uses: actions/github-script@v9
        env:
          SOURCE_BRANCH: ${{ inputs.source-branch }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Cache preparation must be dispatched on main');
            }
            const manual = context.eventName === 'workflow_dispatch';
            const branch = manual ? process.env.SOURCE_BRANCH : 'main';
            if (!/^(main|release\/[0-9]{2}\.[0-9]{2})$/.test(branch)) {
              throw new Error('Source must be main or release/YY.MM in this repository');
            }
            const ref = `refs/heads/${branch}`;
            // Resolve after concurrency admission, not from the superseded push event.
            const {data: current} = await github.rest.repos.getCommit({...context.repo, ref});
            core.setOutput('source-ref', ref);
            core.setOutput('source-sha', current.sha);
            core.setOutput('source-branch', branch);
      - name: Checkout pinned build source
        if: steps.source.outputs.source-sha != ''
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ steps.source.outputs.source-sha }}
          persist-credentials: false
      - name: Check cache preparation support on this source
        if: steps.source.outputs.source-sha != ''
        id: support
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const required = [
              '.github/gpu-ci-suites.json', 'ci/toolchains.json', 'ci/image-config.py',
              '.github/scripts/gpu-ci/image.py', '.github/scripts/gpu-ci/run.sh',
              '.github/scripts/gpu-ci/download-auth.py', '.github/scripts/gpu-ci/report.py',
              '.github/scripts/gpu-ci/settings.xml', '.github/scripts/gpu-ci/cache.js',
              'ci/premerge-build.sh',
            ];
            if (required.some(path => !fs.existsSync(path))) {
              core.notice('Cache preparation skipped: this source needs the build-only cache workflow/helpers backported first');
              return;
            }
            core.setOutput('ready', 'true');
      - name: Validate source release and toolchain pins
        if: steps.support.outputs.ready == 'true'
        env:
          SOURCE_BRANCH: ${{ steps.source.outputs.source-branch }}
        run: python3 ci/image-config.py version --branch "$SOURCE_BRANCH"
      - name: Checkout trusted suite selector
        if: steps.support.outputs.ready == 'true'
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          repository: NVIDIA/spark-rapids-common
          ref: main
          path: .ci-common
          persist-credentials: false
      - name: Check accumulated changes against complete warm caches
        if: steps.support.outputs.ready == 'true'
        id: suites
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.source-branch }}
          POM_HASH: ${{ hashFiles('pom.xml') }}
          CI_IMAGE_METADATA_HELPER: ${{ github.workspace }}/.ci-common/container-image/metadata.py
        with:
          script: |
            const fs = require('node:fs');
            const {execFileSync} = require('node:child_process');
            const {selectSuites} = require(`${process.env.GITHUB_WORKSPACE}/.ci-common/workflow-suite-selector`);
            const {alreadyPrepared} = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/gpu-ci/cache.js`);
            const path = '.github/gpu-ci-suites.json';
            const catalog = JSON.parse(fs.readFileSync(path, 'utf8'));
            const suites = selectSuites([{filename: path}], catalog);
            const prepared = [];
            if (suites.includes('jni')) {
              const args = ['ci/image-config.py', 'select'];
              if (process.env.SOURCE_BRANCH === 'main') args.push('--allow-main-fallback');
              const configs = JSON.parse(execFileSync('python3', args, {encoding: 'utf8'}));
              // Optional cache observations share one minute, not a full timeout per variant.
              const deadline = Date.now() + 60000;
              for (const [classifier, selected] of Object.entries(configs)) {
                if (Date.now() >= deadline) {
                  core.warning('Cache lookup budget exhausted; prepare remaining variants');
                  break;
                }
                const architecture = selected.platform.split('/')[1];
                const family = classifier.split('-')[0];
                // Metadata checks do not enable a platform; prepare's matrix owns that.
                if (await alreadyPrepared({github, context, core, catalog, selectSuites, selected, family, deadline,
                    source: process.env.SOURCE_SHA, pomHash: process.env.POM_HASH})) {
                  prepared.push(`${family}/${architecture}`);
                }
              }
            }
            core.setOutput('suites', JSON.stringify(suites));
            core.setOutput('prepared', JSON.stringify(prepared));
            core.info(`Already prepared: ${prepared.join(', ') || 'none'}; other enabled variants will build`);

  prepare:
    name: Prepare ${{ matrix.classifier }} ${{ matrix.architecture }} caches
    needs: select
    if: contains(fromJSON(needs.select.outputs.suites || '[]'), 'jni')
    strategy:
      fail-fast: false
      matrix:
        classifier: [cuda12, cuda13]
        architecture: [amd64]
    runs-on: ubuntu-latest
    # 80 minutes of queue waits + 240 minutes of execution leave 40 for coordination.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      # No source execution in this write-token coordinator. Workers are read-only.
      - name: Prepare caches with CPU queue fallback
        if: ${{ !contains(fromJSON(needs.select.outputs.prepared), format('{0}/{1}', matrix.classifier, matrix.architecture)) }}
        uses: NVIDIA/spark-rapids-common/runner-queue-fallback@main
        with:
          workflow: gpu-ci-worker.yml
          workflow-ref: main
          source-ref: ${{ needs.select.outputs.source-ref }}
          source-sha: ${{ needs.select.outputs.source-sha }}
          # Let an allocated warmup finish; queued workers still require current source.
          source-policy: pinned-after-start
          workload: '{"classifier":"${{ matrix.classifier }}","architecture":"${{ matrix.architecture }}","base-branch":"${{ needs.select.outputs.source-branch }}","mode":"cache"}'
          runner-type: cpu-${{ matrix.architecture }}
          # Keep compilation on >=12-vCPU runners, preferring the largest available size.
          runners: >-
            [{"group":"nv-cpu-general","labels":"linux-${{ matrix.architecture }}-cpu32"},
             {"group":"nv-cpu-general","labels":"linux-${{ matrix.architecture }}-cpu16"},
             {"group":"nv-cpu-general","labels":"linux-${{ matrix.architecture }}-cpu32","queue-timeout-minutes":60}]
          queue-policy: standard
          queue-timeout-minutes: '10'
          execution-timeout-minutes: '240'
