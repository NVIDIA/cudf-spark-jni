# Test-only validation. Only a new maintainer label approves a new PR head.
name: Sonar runner pilot
run-name: Sonar runner pilot for PR ${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [labeled]
    branches: [main, 'release/**']

permissions: {}

# Serialize this PR through scanning and collection to preserve analysis order.
concurrency:
  group: sonar-runner-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.event.label.name == 'sonar-runner-pilot' &&
      github.event.pull_request.number == 5400 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      sha: ${{ steps.approve.outputs.sha }}
      branch: ${{ steps.approve.outputs.branch }}
      base: ${{ steps.approve.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Approve the labeled PR head
        id: approve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          MAVEN_MIRROR: ${{ vars.SONAR_RUNNER_PILOT_MAVEN_MIRROR }}
        with:
          retries: 0
          script: |
            const approve = require('./ci/sonar-pilot-approval.js');
            await approve({github, context, core, initial: true});
      - name: Mark this Sonar scope pending using common PR 77
        uses: NVIDIA/spark-rapids-common/sonar-check/report@962872d1f2f2647df7da157941b8496c3bd25a9f
        with:
          phase: pending
          project: ${{ vars.SONAR_PROJECT_KEY }}
          pr-number: ${{ github.event.pull_request.number }}
          sha: ${{ steps.approve.outputs.sha }}
          base-ref: ${{ steps.approve.outputs.base }}
          sonar-url: ${{ secrets.SONAR_HOST_URL }}

  security:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.scan.outputs.sha }}
    steps:
      - name: Checkout approved source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
          path: source
      - name: Checkout the reviewed shared scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/spark-rapids-common
          ref: 962872d1f2f2647df7da157941b8496c3bd25a9f
          persist-credentials: false
          path: common
      # Pre-merge validation only: the production action requires a published image.
      # Exercise the same reviewed image recipe/core without publishing a PR image.
      - name: Validate script security with the proposed image
        id: scan
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        run: python3 -I source/ci/sonar-pilot-security.py

  compile:
    needs: [authorize, security]
    runs-on: [self-hosted, Linux, X64, spark-sonar-internal]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.compile.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Recheck approval after runner allocation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
          APPROVED_BASE: ${{ needs.authorize.outputs.base }}
        with:
          script: |
            const approve = require('./ci/sonar-pilot-approval.js');
            await approve({github, context, core});
      - name: Compile Java without Sonar credentials
        id: compile
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
          MAVEN_MIRROR: ${{ vars.SONAR_RUNNER_PILOT_MAVEN_MIRROR }}
          MAVEN_SETTINGS: ${{ runner.temp }}/sonar-maven-settings.xml
        run: python3 -I ci/sonar-pilot-build.py
      - name: Transfer only compiled classes to a fresh worker
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-classes-${{ github.run_attempt }}
          path: target/classes/**/*.class
          if-no-files-found: error
          retention-days: 3

  scan:
    needs: [authorize, security, compile]
    runs-on: [self-hosted, Linux, X64, spark-sonar-internal]
    timeout-minutes: 30
    outputs:
      attempt: ${{ steps.collect.outputs.source-attempt }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout approved source in a fresh scan worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.security.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck approval after runner allocation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
          APPROVED_BASE: ${{ needs.authorize.outputs.base }}
        with:
          script: |
            const approve = require('./ci/sonar-pilot-approval.js');
            await approve({github, context, core});
      - name: Download this build's compiled classes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compile.outputs.artifact-id }}
          path: target/classes
          digest-mismatch: error
      - name: Scan the approved SHA and wait for the quality gate
        id: analyze
        continue-on-error: true
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ needs.authorize.outputs.branch }}
          PR_BASE: ${{ needs.authorize.outputs.base }}
          PROJECT_VERSION: ${{ needs.compile.outputs.version }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_RUNNER_PILOT_TOKEN }}
        run: bash ci/sonar-pilot-scan.sh
      - name: Collect the exact analysis using common PR 77
        id: collect
        if: always() && steps.analyze.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 12
        uses: NVIDIA/spark-rapids-common/sonar-check/collect@962872d1f2f2647df7da157941b8496c3bd25a9f
        with:
          project: ${{ vars.SONAR_PROJECT_KEY }}
          pr-number: ${{ github.event.pull_request.number }}
          sha: ${{ needs.authorize.outputs.sha }}
          base-ref: ${{ needs.authorize.outputs.base }}
          scanner-outcome: ${{ steps.analyze.outcome }}
          sonar-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_RUNNER_PILOT_TOKEN }}
      - name: Transfer the result even when the quality gate fails
        id: upload
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sonar-result.json
          if-no-files-found: error
          retention-days: 3

  report:
    needs: [authorize, security, compile, scan]
    if: always() && needs.authorize.result == 'success' && needs.authorize.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
      statuses: write
    steps:
      - name: Download the exact producing scan artifact
        id: download
        if: needs.scan.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scan.outputs.artifact-id }}
          path: ${{ runner.temp }}/sonar-report
          digest-mismatch: error
      - name: Report the check and summary using common PR 77
        if: always()
        uses: NVIDIA/spark-rapids-common/sonar-check/report@962872d1f2f2647df7da157941b8496c3bd25a9f
        with:
          result-path: ${{ runner.temp }}/sonar-report/sonar-result.json
          project: ${{ vars.SONAR_PROJECT_KEY }}
          pr-number: ${{ github.event.pull_request.number }}
          sha: ${{ needs.authorize.outputs.sha }}
          base-ref: ${{ needs.authorize.outputs.base }}
          source-attempt: ${{ needs.scan.outputs.attempt || github.run_attempt }}
          scan-result: ${{ steps.download.outcome == 'success' && needs.scan.result || 'failure' }}
          sonar-url: ${{ secrets.SONAR_HOST_URL }}
